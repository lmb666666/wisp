version: 2

project_name: wisp

before:
  hooks:
    - go mod tidy

builds:
  - id: wisp
    main: ./cmd/wisp
    binary: wisp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/lmb666666/wisp/internal/version.Version={{.Version}}
      - -X github.com/lmb666666/wisp/internal/version.Commit={{.ShortCommit}}
      - -X github.com/lmb666666/wisp/internal/version.Date={{.Date}}
  - id: wisp-cli
    main: ./cmd/wisp-cli
    binary: wisp-cli
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/lmb666666/wisp/internal/version.Version={{.Version}}
      - -X github.com/lmb666666/wisp/internal/version.Commit={{.ShortCommit}}
      - -X github.com/lmb666666/wisp/internal/version.Date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  prerelease: auto

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
