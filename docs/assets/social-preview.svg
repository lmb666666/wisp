      <stop offset="0" stop-color="#d97b42"/>
      <stop offset="1" stop-color="#a9431d"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff9ee"/>
      <stop offset="1" stop-color="#ffe7c7"/>
