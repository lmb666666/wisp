  </g>

  <text x="470" y="228" font-family="C059, 'Bitstream Vera Serif', serif" font-size="174" letter-spacing="-7" fill="#2b1d16">wisp</text>
  <text x="478" y="306" font-family="'Noto Sans CJK SC', 'Noto Sans CJK HK', sans-serif" font-size="46" fill="#6f5a4b">轻轻说出，牢牢拥有。</text>
