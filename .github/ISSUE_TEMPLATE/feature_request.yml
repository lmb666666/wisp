name: Feature request
description: 提出与现有产品方向一致的建议
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Wisp 刻意保持小。请先说明使用场景，而不是只给功能名。
        明确不做：评论、多用户/角色、联邦、MCP、Copilot/RAG、TUI、实时日志控制台、多主题、原生 App。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 现在怎么做？为什么不够好？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / 取舍
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 纯前端 / 交互
        - API / 数据模型
        - 导入导出 / 备份
        - 部署 / 运维
        - 文档
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 这不是产品边界中明确不做的功能
          required: true
