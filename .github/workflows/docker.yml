name: Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 镜像 tag（同时用于 OCI version）
        required: true
        default: latest
      ref:
        description: 要构建的 git ref
        required: true
        default: main
      latest:
        description: 是否同时更新 latest
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build & push multi-arch image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.tag }}
            ${{ inputs.latest && format('{0}:latest', env.IMAGE_NAME) || '' }}
          build-args: |
            VERSION=${{ inputs.tag }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=docker-manual
          cache-to: type=gha,mode=max,scope=docker-manual
