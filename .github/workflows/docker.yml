name: Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 镜像 tag（同时用于 OCI version）
        required: true
        default: latest
      ref:
        description: 要构建的 git ref
        required: true
        default: main
      latest:
        description: 是否同时更新 latest
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build & push multi-arch image
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag input
        run: |
          # VERSION 进镜像 label 与 ldflags：校验格式，防止任意 tag 覆盖 latest 等
          echo "${{ inputs.tag }}" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$' \
            || { echo "tag 必须是语义化版本，如 0.4.2 / v0.4.2"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.tag }}
            ${{ inputs.latest && format('{0}:latest', env.IMAGE_NAME) || '' }}
          build-args: |
            VERSION=${{ inputs.tag }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=docker-manual
          cache-to: type=gha,mode=max,scope=docker-manual
