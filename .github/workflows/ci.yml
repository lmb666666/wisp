name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build embedded web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - run: go test -race ./...
      - run: go build ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Docker (build only)
    runs-on: ubuntu-latest
    needs: [go, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build amd64/arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install deps and build web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install Playwright browser
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Build server
        run: CGO_ENABLED=0 go build -trimpath -o wisp ./cmd/wisp
      - name: Start server
        run: |
          WISP_PORT=18099 WISP_PUBLIC_URL=http://localhost:18099 \
          WISP_DATA_DIR="$RUNNER_TEMP/wisp-e2e" WISP_API_RATE_LIMIT=1000 \
          WISP_AUTH_RATE_LIMIT=1000 WISP_ENABLE_SWAGGER=true ./wisp > wisp-e2e.log 2>&1 &
          echo $! > wisp-e2e.pid
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18099/healthz && break
            sleep 1
          done
      - name: Run Playwright
        working-directory: web
        env:
          WISP_URL: http://localhost:18099
        run: pnpm exec playwright test
      - name: Server log on failure
        if: failure()
        run: tail -100 wisp-e2e.log
      - name: Stop server
        if: always()
        run: kill "$(cat wisp-e2e.pid)" 2>/dev/null || true
