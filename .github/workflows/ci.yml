name: CI

# 版本统一在 packageManager（web/package.json）与这里各设一份：pnpm/action-setup
# 不支持子目录 package.json 自动读取，工作流级 env 是单一事实来源。
env:
  PNPM_VERSION: "11.28.5"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      # Actions 按提交 SHA 固定（tag 可被上游重打）；dependabot 负责升级
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build embedded web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: golangci-lint
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: v2.15
      - run: go test -race ./...
      - run: go build ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Docker (build only)
    runs-on: ubuntu-latest
    needs: [go, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build amd64/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install deps and build web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install Playwright browser
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Build server
        run: CGO_ENABLED=0 go build -trimpath -o wisp ./cmd/wisp
      - name: Start server
        run: |
          WISP_PORT=18099 WISP_PUBLIC_URL=http://localhost:18099 \
          WISP_DATA_DIR="$RUNNER_TEMP/wisp-e2e" WISP_API_RATE_LIMIT=1000 \
          WISP_AUTH_RATE_LIMIT=1000 WISP_ENABLE_SWAGGER=true ./wisp > wisp-e2e.log 2>&1 &
          echo $! > wisp-e2e.pid
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18099/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          # 轮询失败也要显式失败：否则 Playwright 会跑出与根因无关的报错
          curl -fsS http://127.0.0.1:18099/healthz || { tail -100 wisp-e2e.log; exit 1; }
      - name: Run Playwright
        working-directory: web
        env:
          WISP_URL: http://localhost:18099
        run: pnpm exec playwright test
      - name: Server log on failure
        if: failure()
        run: tail -100 wisp-e2e.log
      - name: Stop server
        if: always()
        run: kill "$(cat wisp-e2e.pid)" 2>/dev/null || true
